[package]
name = "kepid"
description = "Satellite orbits packed into UUIDv7"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"
# Reads docs/profile0_vectors.csv at the repository root, outside this crate.
exclude = ["tests/vectors.rs"]

[features]
# OMM support: the `Omm` struct, with serde Serialize/Deserialize.
omm = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
