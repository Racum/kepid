[package]
name = "kepid"
description = "KepID: zero-line orbital elements packed into a UUIDv7"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# OMM support: the `Omm` struct, with serde Serialize/Deserialize.
omm = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
